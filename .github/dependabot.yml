version: 2
updates:
  # `bun`, not `npm`. The npm updater rewrites package.json without
  # regenerating bun.lock, so its PRs can never pass the frozen-lockfile gate.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ['*']
    ignore:
      # TypeScript 7 replaced the compiler with the native port, which does not
      # expose the API `astro check` uses — `bun run typecheck` fails outright
      # on it. Dependabot cannot know that, so it reopens the same red PR every
      # week. Drop this entry when @astrojs/check supports 7.
      - dependency-name: typescript
        versions: ['>=7']

  # Keeps the SHA pins current — Dependabot reads the trailing "# vX.Y.Z"
  # comment and rewrites both the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
