name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A push made with GITHUB_TOKEN does not trigger workflows, so the commit
  # that lands regenerated visual baselines never gets a run of its own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Run individually rather than via `bun run verify` so a failure names
      # itself in the job list instead of hiding inside one chained step.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Payload budget
        run: bun run budget

      - name: Content drift
        run: bun run verify:content

      - name: Install Playwright browser
        run: bunx playwright install chromium --with-deps

      - name: Accessibility, end-to-end & visual
        run: bun run e2e

      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-evidence
          path: playwright-report/
          retention-days: 7

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # The commit-msg hook is skippable with --no-verify; this is not. Both
      # call the same validator, so the rules cannot drift apart.
      - name: Commit messages
        run: bun run lint:commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
